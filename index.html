<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIFASHAFA LUXURY DASTER</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-rose-50/30 text-gray-800 font-sans min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-rose-100">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <h1 class="font-serif font-bold text-lg text-rose-900 tracking-wide">SHIFASHAFA</h1>
                <p class="text-[10px] text-rose-500 tracking-widest font-semibold uppercase">Luxury Daster Boutique</p>
            </div>
            <button onclick="openAdminModal()" class="text-xs bg-rose-100 text-rose-700 px-3 py-1.5 rounded-full font-medium border border-rose-200 hover:bg-rose-200">
                <i class="fa-solid fa-lock mr-1"></i> Admin Panel
            </button>
        </div>
    </header>

    <!-- Banner / Intro -->
    <div class="max-w-md mx-auto px-4 mt-4">
        <div class="bg-gradient-to-r from-rose-400 to-pink-500 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
            <h2 class="font-serif text-xl font-bold mb-1">Koleksi Daster Premium</h2>
            <p class="text-xs text-rose-100 mb-3">Bahan adem, nyaman, dan tetap tampil elok elegan di rumah.</p>
            <a href="https://wa.me/628561663426" target="_blank" class="inline-block bg-white text-rose-600 text-xs font-bold px-4 py-2 rounded-xl shadow hover:bg-rose-50">
                <i class="fa-brands fa-whatsapp mr-1 text-green-500"></i> Hubungi CS
            </a>
        </div>
    </div>

    <!-- Product Grid (Real-time Live Sync) -->
    <main class="max-w-md mx-auto px-4 mt-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-serif font-bold text-gray-800 text-base">Produk Terbaru</h3>
            <span id="sync-status" class="text-[11px] text-green-600 font-medium flex items-center gap-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Live Sync Active
            </span>
        </div>

        <div id="product-list" class="grid grid-cols-2 gap-3">
            <div class="col-span-2 text-center py-10 text-gray-400 text-sm">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-rose-400 mb-2"></i>
                <p>Memuat katalog produk...</p>
            </div>
        </div>
    </main>

    <!-- Modal Login/Panel Admin -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div id="admin-login-view">
                <h3 class="font-serif font-bold text-rose-900 text-lg mb-1">Login Admin</h3>
                <p class="text-xs text-gray-500 mb-4">Masukkan PIN Admin untuk mengelola produk.</p>
                <input type="password" id="admin-pin" placeholder="Masukkan PIN" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm mb-3 focus:outline-none focus:border-rose-400">
                <button onclick="verifyAdminPIN()" class="w-full bg-rose-500 text-white font-bold py-2 rounded-xl text-sm shadow hover:bg-rose-600">Masuk</button>
            </div>

            <div id="admin-dashboard-view" class="hidden">
                <h3 class="font-serif font-bold text-rose-900 text-lg mb-3">Tambah Produk Baru</h3>
                <form id="add-product-form" onsubmit="saveProduct(event)" class="space-y-3">
                    <input type="text" id="p-name" placeholder="Nama Daster" required class="w-full border rounded-xl px-3 py-1.5 text-xs">
                    <input type="number" id="p-price" placeholder="Harga (Rp)" required class="w-full border rounded-xl px-3 py-1.5 text-xs">
                    <input type="url" id="p-image" placeholder="URL Foto Produk (https://...)" required class="w-full border rounded-xl px-3 py-1.5 text-xs">
                    <textarea id="p-desc" placeholder="Keterangan / Bahan" class="w-full border rounded-xl px-3 py-1.5 text-xs rows-2"></textarea>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-xl text-xs shadow hover:bg-green-700">
                        <i class="fa-solid fa-plus mr-1"></i> Simpan & Broadcast Produk
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Version 9+ Compatible) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Konfigurasi Firebase Proyek web-daster milik Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCa3L7mmrqc6To2BXKZsuWxV8aXZM-tKAg",
            authDomain: "web-daster.firebaseapp.com",
            databaseURL: "https://web-daster-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "web-daster",
            storageBucket: "web-daster.firebasestorage.app",
            messagingSenderId: "228831593354",
            appId: "1:228831593354:web:0e1ae3c1c803e87809be73"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const productsRef = database.ref('products');

        const ADMIN_PIN = "AHS99!";
        const ADMIN_PHONE = "628561663426";

        // Realtime Listener
        productsRef.on('value', (snapshot) => {
            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                productContainer.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 text-xs">Belum ada produk. Tambahkan melalui Panel Admin.</div>`;
                return;
            }

            Object.keys(data).forEach((id) => {
                const item = data[id];
                const waMessage = encodeURIComponent(`Halo Admin SHIFASHAFA, saya mau pesan:\n*${item.name}*\nHarga: Rp ${Number(item.price).toLocaleString('id-ID')}`);
                const waLink = `https://wa.me/${ADMIN_PHONE}?text=${waMessage}`;

                productContainer.innerHTML += `
                    <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-rose-100 flex flex-col justify-between">
                        <div>
                            <img src="${item.image}" alt="${item.name}" class="w-full h-36 object-cover rounded-xl mb-2 bg-gray-100">
                            <h4 class="font-bold text-xs text-gray-800 line-clamp-1">${item.name}</h4>
                            <p class="text-[11px] font-semibold text-rose-600 mt-0.5">Rp ${Number(item.price).toLocaleString('id-ID')}</p>
                            <p class="text-[10px] text-gray-400 line-clamp-2 mt-1">${item.desc || ''}</p>
                        </div>
                        <a href="${waLink}" target="_blank" class="mt-3 block w-full text-center bg-rose-500 hover:bg-rose-600 text-white text-[11px] font-bold py-1.5 rounded-xl shadow-xs">
                            Beli via WA
                        </a>
                    </div>
                `;
            });
        });

        // Modal Controls
        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        function verifyAdminPIN() {
            const inputPin = document.getElementById('admin-pin').value;
            if (inputPin === ADMIN_PIN) {
                document.getElementById('admin-login-view').classList.add('hidden');
                document.getElementById('admin-dashboard-view').classList.remove('hidden');
            } else {
                alert('PIN Admin Salah!');
            }
        }

        // Simpan Produk Baru ke Cloud Firebase
        function saveProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const image = document.getElementById('p-image').value;
            const desc = document.getElementById('p-desc').value;

            const newProductRef = productsRef.push();
            newProductRef.set({
                name: name,
                price: price,
                image: image,
                desc: desc,
                createdAt: Date.now()
            }, (error) => {
                if (error) {
                    alert('Gagal menyimpan data: ' + error.message);
                } else {
                    alert('Produk berhasil disimpan! Tampilan customer akan langsung ter-update otomatis.');
                    document.getElementById('add-product-form').reset();
                    closeAdminModal();
                }
            });
        }
    </script>
</body>
</html>
